name: fetch-media
on: push
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p media
          i=1
          while read -r u; do [ -n "$u" ] && curl -fsSL "$u" -o "media/take$i.mp3"; i=$((i+1)); done < urls.txt
          ls -la media
          git config user.name "media-relay"
          git config user.email "media-relay@users.noreply.github.com"
          git add media
          git commit -m "media"
          git push
